<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hey, Press Pause — film player">
  <title>Hey, Press Pause</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .playback-error { position: absolute; inset: auto 1rem 4rem; padding: 1rem; color: #fff; background: #222; font: 14px/1.5 Arial, sans-serif; text-align: center; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <video id="film" controls playsinline preload="metadata" poster="../../assets/press-pause-remaster-20260929.jpg" aria-label="Hey, Press Pause video"></video>
  <p class="playback-error" id="playback-error" role="status" hidden>This video could not be loaded. Please reload this page.</p>
  <script src="../choice/assets/hls.min.js"></script>
  <script>
    const video = document.getElementById('film');
    const playbackError = document.getElementById('playback-error');
    const source = './hls-remaster-20260929/index.m3u8';
    video.addEventListener('error', () => { playbackError.hidden = false; });
    video.addEventListener('playing', () => { playbackError.hidden = true; });
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = source;
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ maxBufferLength: 30, backBufferLength: 30 });
      hls.loadSource(source);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_event, data) => {
        if (data.fatal) playbackError.hidden = false;
      });
    } else {
      playbackError.hidden = false;
    }
  </script>
</body>
</html>
