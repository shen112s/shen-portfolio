<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="《全球新闻传播》在线放映页" />
    <title>《全球新闻传播》</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M11 9l12 7-12 7z' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
      body { display: grid; place-items: center; }
      video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    </style>
  </head>
  <body>
    <video id="film" controls playsinline preload="metadata" aria-label="《全球新闻传播》视频"></video>
    <script src="./assets/hls.min.js"></script>
    <script>
      const video = document.getElementById("film");
      const source = "./hls/index.m3u8";

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = source;
      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ maxBufferLength: 30, backBufferLength: 30 });
        hls.loadSource(source);
        hls.attachMedia(video);
      }
    </script>
  </body>
</html>
